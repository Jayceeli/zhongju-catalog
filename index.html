          renderOverlayPage(body, "heat13-overlay", "heat-page-13-v4", pageHtml);
        };

        const patchHeatPage14 = (page) => {
          const body = page.querySelector(".flex-1");
          if (!body) return;

          const headerTitle = page.querySelector(".header-title");
          const headerSubtitle = page.querySelector(".header-subtitle");
          if (headerTitle) headerTitle.textContent = "耐热剂加工建议与问题处理";
          if (headerSubtitle) headerSubtitle.textContent = "Processing Window + Troubleshooting";

          const processCards = renderRowCards({
            rows: heat14ProcessWindowRows,
            headers: ["牌号组", "C2", "C3", "C4+目标", "工艺重点"],
            titleIndex: 0,
            toneClass: "tone-heat",
            highlightIndices: [3]
          });

          const sopCards = renderRowCards({
            rows: heat14SopRows,
            headers: ["阶段", "关键动作", "目标结果"],
            titleIndex: 0,
            toneClass: "tone-heat",
            highlightIndices: [2]
          });

          const visualCards = heat14VisualCards
            .map(
              (item) => `
                <section class="heat-visual-card">
                  <div class="heat-visual-media">
                    <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async" />
                  </div>
                  <div class="heat-visual-body">
                    <div class="heat-visual-head">
                      <h4 class="heat-visual-title">${escapeHtml(item.title)}</h4>
                      <span class="heat-visual-tag">${escapeHtml(item.tag)}</span>
                    </div>
                    <p class="heat-visual-desc">${escapeHtml(item.desc)}</p>
                    <p class="heat-visual-meta"><strong>${escapeHtml(item.key)}：</strong>${escapeHtml(item.value)}</p>
                  </div>
                </section>
              `
            )
            .join("");

          const checklistCards = heat14ProcessChecklist
            .map(
              (item) => `
                <section class="manual-data-card tone-heat">
                  <div class="manual-card-head">
                    <h4 class="manual-card-title">${escapeHtml(item.title)}</h4>
                  </div>
                  <div class="manual-field-grid">
                    ${renderDataField("要点", item.detail, true)}
                  </div>
                </section>
              `
            )
            .join("");

          const issueCards = renderRowCards({
            rows: heat14IssueRows,
            headers: ["异常现象", "常见原因", "优先调整建议"],
            titleIndex: 0,
            toneClass: "tone-heat",
            highlightIndices: [2]
          });

          const pageHtml = `
            <div class="manual-page">
              <p class="manual-lead tone-heat">
                耐热剂体系放大时，稳定分散与热史控制比“单纯拉高温度”更关键。
                本页给出造粒窗口、打样SOP和常见问题处理建议，用于试产与量产对齐。
              </p>

              <section class="manual-block tone-heat">
                <div class="manual-block-head">
                  <h3 class="manual-block-title">造粒温度窗口（双螺杆）</h3>
                  <p class="manual-block-subtitle">Extrusion temperature guideline</p>
                </div>
                <div class="manual-block-body">
                  <div class="manual-card-grid">
                    ${processCards}
                  </div>
                </div>
              </section>

              <section class="manual-block tone-heat">
                <div class="manual-block-head">
                  <h3 class="manual-block-title">打样SOP与过程检查</h3>
                  <p class="manual-block-subtitle">Sampling SOP + process checklist</p>
                </div>
                <div class="manual-block-body">
                  <div class="heat-visual-grid is-three">
                    ${visualCards}
                  </div>
                  <div class="manual-card-grid" style="margin-top:0.5rem;">
                    ${sopCards}
                  </div>
                  <div class="manual-card-grid" style="margin-top:0.5rem;">
                    ${checklistCards}
                  </div>
                </div>
              </section>

              <section class="manual-block tone-heat">
                <div class="manual-block-head">
                  <h3 class="manual-block-title">常见问题与调整方向</h3>
                  <p class="manual-block-subtitle">Troubleshooting</p>
                </div>
                <div class="manual-block-body">
                  <div class="manual-card-grid">
                    ${issueCards}
                  </div>
                  <p class="manual-note">注：建议按“外观 -> 流动 -> 冲击 -> VOC”顺序做迭代评估，避免一次性多变量改动导致判断失真。</p>
                </div>
              </section>
            </div>
          `;

          renderOverlayPage(body, "heat14-overlay", "heat-page-14-v4", pageHtml);
        };

        const patchCurrentPage = () => {
          const pageNum = getCurrentPageNumber();
          const page = getCurrentA4Page();
          if (!pageNum || !page) return;

          if (pageNum === 2) {
            patchCompanyProfile(page);
            return;
          }

          if (pageNum === 3) {
            patchSuppliersPage(page);
            return;
          }

          if (pageNum === 4) {
            patchCatalogPage(page, {
              key: "catalog-page-4-v1",
              headerTitle: "PC & PC Alloys / ABS & ASA",
              headerSubtitle: "Product Portfolio",
              sections: page4Sections
            });
            return;
          }

          if (pageNum === 5) {
            patchCatalogPage(page, {
              key: "catalog-page-5-v1",
              headerTitle: "PA & PBT / PMMA & PLA & PETG",
              headerSubtitle: "Product Portfolio",
              sections: page5Sections
            });
            return;
          }

          if (pageNum === 6) {
            patchMbsIntroPage(page);
            return;
          }

          if (pageNum === 7) {
            patchMbsComparePage(page);
            return;
          }

          if (pageNum === 8) {
            patchAcrPcPbtPage(page);
            return;
          }

          if (pageNum === 9) {
            patchTransparentTougheningPage(page);
            return;
          }

          if (pageNum === 10) {
            patchNylonPbtPage(page);
            return;
          }

          if (pageNum === 11) {
            patchMergedPage11(page);
            return;
          }

          if (pageNum === 12) {
            patchHeatPage13(page);
            return;
          }

          if (pageNum === 13) {
            patchHeatPage14(page);
            return;
          }

          if (pageNum === 14) {
            restoreOriginalPageView(page);
          }
        };

        const start = () => {
          let isPatching = false;
          let scheduled = false;

          const runPatches = () => {
            if (isPatching) return;
            isPatching = true;
            try {
              patchCurrentPage();
            } finally {
              isPatching = false;
            }
          };

          const schedulePatches = () => {
            if (scheduled) return;
            scheduled = true;
            window.requestAnimationFrame(() => {
              scheduled = false;
              runPatches();
            });
          };

          runPatches();
          const root = document.getElementById("root");
          if (!root) return;

          const observer = new MutationObserver(() => {
            if (isPatching) return;
            schedulePatches();
          });

          observer.observe(root, { childList: true, subtree: true });
          window.addEventListener("beforeunload", () => observer.disconnect(), { once: true });
          window.addEventListener("keydown", schedulePatches, { passive: true });
          window.addEventListener("click", schedulePatches, { passive: true });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start, { once: true });
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
